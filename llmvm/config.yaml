# Minimal LLMVM configuration
# Place in ~/.config/llmvm/config.yaml or set LLMVM_CONFIG environment variable

# Core settings (only include if different from defaults)
# executor: 'anthropic'  # Default is 'response' as of latest changes

# Only include helper functions that you want to enable
# Most are already enabled by default in the code
helper_functions:
  - llmvm.server.tools.browser.Browser
  - llmvm.server.tools.sheets.GoogleSheetsManager
  - llmvm.server.tools.search_tool.Search.google_search
  - llmvm.server.tools.database.DatabaseHelpers.connect_database
  - llmvm.server.tools.database.DatabaseHelpers.query_database
  - llmvm.server.tools.semantic_database.SemanticDatabaseHelpers.create_semantic_understanding

# Bash helper settings (if you want to change defaults)
# bash_helper:
#   default_approval_mode: 'on_request'  # Default behavior